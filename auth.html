<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Bidesiya</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="assets/css/style.css?v=26" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="card">
        <div class="brand">Bidesiya · बिदेसिया</div>
        <div class="brand-sub">अपने, कहीं भी · Apne, anywhere — Bihar wherever you are.</div>

        <!-- Signed-in banner (shown when we already have a token) -->
        <div id="signed-in-banner" class="banner banner-info" hidden></div>

        <!-- Phone OTP flow -->
        <div id="otp-flow">
          <div class="field">
            <label>Mobile number</label>
            <input class="input" id="phone" type="tel" placeholder="10-digit Indian mobile" autocomplete="tel" maxlength="10" />
          </div>
          <button class="btn btn-primary btn-block" id="btn-request">Send OTP</button>

          <div id="otp-block" hidden style="margin-top:12px">
            <div class="field">
              <label>OTP code</label>
              <input class="input" id="code" type="text" inputmode="numeric" placeholder="6-digit code" autocomplete="one-time-code" maxlength="6" />
            </div>
            <button class="btn btn-primary btn-block" id="btn-verify">Verify &amp; log in</button>
            <div id="dev-code-notice" class="banner banner-warn" hidden style="margin-top:10px"></div>
          </div>
        </div>

        <div class="auth-divider"><span>OR</span></div>

        <!-- Social sign-in buttons — shown only when the backend reports they're configured -->
        <div id="social-buttons" class="social-buttons">
          <button class="social-btn google-btn" id="btn-google" hidden>
            <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
              <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
              <path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.336z"/>
              <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
            </svg>
            Continue with Google
          </button>
          <button class="social-btn facebook-btn" id="btn-facebook" hidden>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2" xmlns="http://www.w3.org/2000/svg">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
            Continue with Facebook
          </button>
          <button class="social-btn linkedin-btn" id="btn-linkedin" hidden>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#0A66C2" xmlns="http://www.w3.org/2000/svg">
              <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.063 2.063 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
            </svg>
            Continue with LinkedIn
          </button>

          <div id="social-empty" class="subtle" style="text-align:center; font-size: 12px; padding: 10px 0">
            Social sign-in is not configured yet. Use phone OTP above.
          </div>
        </div>

        <div class="auth-footer-line">
          <a href="admin/login.html">Log in as admin</a>
        </div>
      </div>

      <div class="auth-signup">
        Any 10-digit mobile signs you up — in dev mode the OTP auto-fills.
      </div>
    </div>
  </div>

  <!-- Facebook SDK — loads only when needed -->
  <div id="fb-root"></div>

  <script type="module" src="assets/js/auth.js?v=26"></script>
</body>
</html>
