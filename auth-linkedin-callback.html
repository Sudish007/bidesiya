<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LinkedIn sign-in — Bidesiya</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #F43F5E 0%, #F97316 50%, #FBBF24 100%);
      color: white;
    }
    .box {
      text-align: center;
      padding: 32px;
      background: rgba(255,255,255,0.15);
      border-radius: 12px;
      backdrop-filter: blur(8px);
    }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0; opacity: 0.9; font-size: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Signing you in with LinkedIn…</h1>
    <p id="msg">Finishing up. This window will close automatically.</p>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error');

      if (error) {
        document.getElementById('msg').textContent = 'LinkedIn returned: ' + (params.get('error_description') || error);
        return;
      }

      // Post the code back to the opener page.
      if (window.opener) {
        window.opener.postMessage(
          { source: 'bidesiya-linkedin', code, state },
          location.origin
        );
        setTimeout(() => window.close(), 300);
      } else {
        document.getElementById('msg').textContent = 'Opened outside the sign-in popup. Please close and try again.';
      }
    })();
  </script>
</body>
</html>
