<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Users — Bidesiya Admin</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap-wide row">
      <a class="brand" href="../index.html">
        <img src="../assets/img/logo-mark.svg" alt="" width="32" height="32" />
        <span>Bidesiya · Admin</span>
      </a>
      <nav class="nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="users.html" class="active">Users</a>
        <a href="moderation.html">Moderation</a>
        <a href="content.html">Content</a>
      </nav>
      <span class="right hstack" id="who">…</span>
      <button class="btn btn-outline" id="btn-signout">Sign out</button>
    </div>
  </header>

  <main class="wrap-wide" style="padding:16px 20px 40px">
    <section class="hero">
      <span class="kicker">People</span>
      <h1>User management</h1>
    </section>

    <div class="hstack" style="gap:10px;flex-wrap:wrap; margin-bottom:16px">
      <input class="input" id="q" placeholder="Search by phone, username, or name" style="flex:1;min-width:220px" />
      <select class="input" id="role" style="max-width:180px">
        <option value="">All roles</option>
        <option value="user">Users</option>
        <option value="moderator">Moderators</option>
        <option value="admin">Admins</option>
      </select>
      <select class="input" id="banned" style="max-width:180px">
        <option value="">All statuses</option>
        <option value="false">Active</option>
        <option value="true">Banned</option>
      </select>
      <button class="btn btn-primary" id="btn-search">Search</button>
    </div>

    <div class="card"><table class="admin-table" id="users-table">
      <thead><tr>
        <th>ID</th><th>Phone / Username</th><th>Display name</th>
        <th>Home</th><th>Role</th><th>Status</th><th>Actions</th>
      </tr></thead>
      <tbody></tbody>
    </table></div>
  </main>

  <script type="module" src="admin.js"></script>
</body>
</html>
