<?xml version="1.0" encoding="UTF-8"?>
<!-- Communities banner — village panchayat under a peepal tree, huts, smoke. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Communities — village panchayat">
  <defs>
    <linearGradient id="bgCm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DBEAFE"/>
      <stop offset="1" stop-color="#FEF3C7"/>
    </linearGradient>
    <radialGradient id="sunCm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F97316"/>
    </radialGradient>
  </defs>

  <rect width="900" height="180" fill="url(#bgCm)"/>

  <!-- Distant hills -->
  <path d="M 0 130 Q 200 100 400 125 Q 600 150 900 120 L 900 180 L 0 180 Z" fill="#94A3B8" opacity="0.35"/>

  <!-- Fields -->
  <path d="M 0 155 Q 300 148 600 155 Q 750 158 900 155 L 900 180 L 0 180 Z" fill="#16A34A" opacity="0.35"/>

  <!-- Sun -->
  <circle cx="150" cy="55" r="30" fill="url(#sunCm)" opacity="0.7"/>

  <!-- Peepal tree (iconic Indian village tree — under which panchayats meet) -->
  <g transform="translate(340 30)">
    <!-- Trunk -->
    <rect x="-5" y="80" width="10" height="65" fill="#8B4513"/>
    <path d="M -5 145 Q 0 148 5 145 L 5 155 L -5 155 Z" fill="#8B4513"/>
    <!-- Big canopy (peepal has broad heart-shaped leaves clumped) -->
    <circle cx="-30" cy="60" r="35" fill="#16A34A"/>
    <circle cx="30" cy="60" r="35" fill="#16A34A"/>
    <circle cx="0" cy="40" r="42" fill="#22C55E"/>
    <circle cx="-40" cy="80" r="28" fill="#16A34A"/>
    <circle cx="40" cy="80" r="28" fill="#16A34A"/>
    <!-- Highlights -->
    <circle cx="-10" cy="30" r="8" fill="#4ADE80" opacity="0.7"/>
    <circle cx="20" cy="45" r="7" fill="#4ADE80" opacity="0.7"/>
    <circle cx="-25" cy="55" r="6" fill="#4ADE80" opacity="0.7"/>
    <!-- Charpoy (rope bed) at base — where panchayat sits -->
    <rect x="-40" y="150" width="80" height="8" fill="#B45309" rx="2"/>
    <line x1="-40" y1="155" x2="40" y2="155" stroke="#FDF6EC" stroke-width="1" opacity="0.5"/>
    <line x1="-40" y1="157" x2="40" y2="157" stroke="#FDF6EC" stroke-width="1" opacity="0.5"/>
    <!-- Legs -->
    <rect x="-40" y="158" width="4" height="12" fill="#8B4513"/>
    <rect x="36" y="158" width="4" height="12" fill="#8B4513"/>
  </g>

  <!-- Mud hut on the right -->
  <g transform="translate(620 100)">
    <!-- Thatched roof -->
    <path d="M -40 20 L 0 -15 L 40 20 Z" fill="#B45309"/>
    <line x1="-40" y1="20" x2="0" y2="-15" stroke="#8B4513" stroke-width="1"/>
    <line x1="0" y1="-15" x2="40" y2="20" stroke="#8B4513" stroke-width="1"/>
    <!-- Roof texture (thatch lines) -->
    <line x1="-30" y1="12" x2="0" y2="-8" stroke="#8B4513" stroke-width="0.8" opacity="0.6"/>
    <line x1="-15" y1="17" x2="0" y2="0" stroke="#8B4513" stroke-width="0.8" opacity="0.6"/>
    <line x1="15" y1="17" x2="0" y2="0" stroke="#8B4513" stroke-width="0.8" opacity="0.6"/>
    <line x1="30" y1="12" x2="0" y2="-8" stroke="#8B4513" stroke-width="0.8" opacity="0.6"/>
    <!-- Walls -->
    <rect x="-32" y="20" width="64" height="40" fill="#DEA070"/>
    <!-- Door -->
    <rect x="-8" y="35" width="16" height="25" fill="#8B4513"/>
    <!-- Small window -->
    <rect x="-25" y="30" width="8" height="8" fill="#8B4513" opacity="0.7"/>
    <rect x="17" y="30" width="8" height="8" fill="#8B4513" opacity="0.7"/>
  </g>

  <!-- Second hut, smaller -->
  <g transform="translate(780 115)">
    <path d="M -25 12 L 0 -10 L 25 12 Z" fill="#B45309"/>
    <rect x="-22" y="12" width="44" height="25" fill="#DEA070"/>
    <rect x="-5" y="18" width="10" height="19" fill="#8B4513"/>
  </g>

  <!-- Smoke curling from a hut -->
  <path d="M 640 85 Q 645 75 640 65 Q 635 55 645 45 Q 655 35 645 25" stroke="#94A3B8" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Small people silhouettes around the charpoy -->
  <g fill="#8B1D34" opacity="0.85">
    <!-- Person 1 -->
    <circle cx="280" cy="155" r="4"/>
    <rect x="277" y="159" width="6" height="12"/>
    <!-- Person 2 -->
    <circle cx="298" cy="152" r="4"/>
    <rect x="295" y="156" width="6" height="14"/>
    <!-- Person 3 (right of tree) -->
    <circle cx="392" cy="153" r="4"/>
    <rect x="389" y="157" width="6" height="13"/>
    <!-- Person 4 -->
    <circle cx="410" cy="155" r="4"/>
    <rect x="407" y="159" width="6" height="12"/>
  </g>

  <!-- Text -->
  <text x="60" y="70" font-family="'Georgia', serif" font-size="38" font-weight="800" fill="#8B1D34">Communities</text>
  <text x="60" y="100" font-family="Arial, sans-serif" font-size="14" fill="#8B3A2A" opacity="0.9">10 districts. Every village. Your people.</text>
  <text x="60" y="125" font-family="Arial, sans-serif" font-size="11" fill="#B45309" opacity="0.85">Ghar wali baat — auto village channels</text>
</svg>
