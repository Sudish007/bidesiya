<?xml version="1.0" encoding="UTF-8"?>
<!-- Bazaar banner — Bihari haat/mandi: awning, litchi basket, silk bolt, sattu tin. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Bazaar — Bihari marketplace">
  <defs>
    <linearGradient id="bgBz" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FEF3C7"/>
      <stop offset="1" stop-color="#FEF3EE"/>
    </linearGradient>
    <pattern id="awning" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="12" height="24" fill="#DC2626"/>
      <rect x="12" width="12" height="24" fill="#FDF6EC"/>
    </pattern>
  </defs>

  <rect width="900" height="180" fill="url(#bgBz)"/>

  <!-- Awning across top -->
  <path d="M 0 20 L 900 20 L 900 55 L 0 55 Z" fill="url(#awning)"/>
  <!-- Awning scallop -->
  <path d="M 0 55
           Q 30 75, 60 55
           Q 90 75, 120 55
           Q 150 75, 180 55
           Q 210 75, 240 55
           Q 270 75, 300 55
           Q 330 75, 360 55
           Q 390 75, 420 55
           Q 450 75, 480 55
           Q 510 75, 540 55
           Q 570 75, 600 55
           Q 630 75, 660 55
           Q 690 75, 720 55
           Q 750 75, 780 55
           Q 810 75, 840 55
           Q 870 75, 900 55
           L 900 55 L 0 55 Z" fill="url(#awning)"/>

  <!-- Stall counter -->
  <rect x="0" y="150" width="900" height="30" fill="#B45309"/>
  <rect x="0" y="145" width="900" height="8" fill="#8B4513"/>

  <!-- Litchi basket (left) -->
  <g transform="translate(150 105)">
    <ellipse cx="0" cy="35" rx="55" ry="12" fill="#8B4513"/>
    <path d="M -50 30 L -55 5 L 55 5 L 50 30 Z" fill="#B45309" stroke="#8B4513" stroke-width="1.5"/>
    <!-- Weave lines -->
    <line x1="-45" y1="8" x2="-42" y2="28" stroke="#8B4513" stroke-width="1" opacity="0.6"/>
    <line x1="-20" y1="8" x2="-18" y2="28" stroke="#8B4513" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="8" x2="0" y2="28" stroke="#8B4513" stroke-width="1" opacity="0.6"/>
    <line x1="20" y1="8" x2="18" y2="28" stroke="#8B4513" stroke-width="1" opacity="0.6"/>
    <line x1="45" y1="8" x2="42" y2="28" stroke="#8B4513" stroke-width="1" opacity="0.6"/>
    <!-- Litchis (red round fruit with bumpy texture) -->
    <circle cx="-30" cy="-2" r="10" fill="#DC2626"/>
    <circle cx="-15" cy="-6" r="11" fill="#E11D48"/>
    <circle cx="0" cy="-4" r="11" fill="#DC2626"/>
    <circle cx="15" cy="-8" r="10" fill="#E11D48"/>
    <circle cx="30" cy="-3" r="10" fill="#DC2626"/>
    <!-- Highlights -->
    <circle cx="-32" cy="-4" r="2.5" fill="#F87171"/>
    <circle cx="-2" cy="-6" r="2.5" fill="#F87171"/>
    <circle cx="28" cy="-5" r="2.5" fill="#F87171"/>
    <!-- Leaves -->
    <path d="M -8 -14 Q -12 -22 -6 -20 Q -2 -22 -4 -14" fill="#16A34A" stroke="#166534" stroke-width="0.8"/>
    <path d="M 18 -18 Q 14 -26 22 -24 Q 26 -26 24 -18" fill="#16A34A" stroke="#166534" stroke-width="0.8"/>
  </g>

  <!-- Silk saree bolt (center-right) -->
  <g transform="translate(560 100)">
    <rect x="-40" y="-5" width="80" height="45" fill="#F43F5E" rx="3"/>
    <rect x="-40" y="-5" width="80" height="8" fill="#FBBF24"/>
    <rect x="-40" y="32" width="80" height="8" fill="#FBBF24"/>
    <!-- Fold lines -->
    <line x1="-40" y1="12" x2="40" y2="12" stroke="#8B1D34" stroke-width="0.8" opacity="0.5"/>
    <line x1="-40" y1="22" x2="40" y2="22" stroke="#8B1D34" stroke-width="0.8" opacity="0.5"/>
    <!-- Madhubani motif -->
    <circle cx="-20" cy="17" r="3" fill="#FBBF24"/>
    <circle cx="0" cy="17" r="3" fill="#FDF6EC"/>
    <circle cx="20" cy="17" r="3" fill="#FBBF24"/>
    <!-- Bolt cylinder (side) -->
    <ellipse cx="40" cy="18" rx="6" ry="24" fill="#8B1D34"/>
  </g>

  <!-- Sattu tin (right) -->
  <g transform="translate(720 108)">
    <rect x="-25" y="-10" width="50" height="35" fill="#EA580C" stroke="#8B3A2A" stroke-width="1.5"/>
    <rect x="-27" y="-14" width="54" height="6" fill="#B45309"/>
    <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#FDF6EC">SATTU</text>
  </g>

  <!-- Vegetables in front (green leafy) -->
  <g transform="translate(300 130)">
    <ellipse cx="0" cy="15" rx="35" ry="8" fill="#16A34A" opacity="0.85"/>
    <path d="M -25 15 Q -20 -5 -10 12" fill="#16A34A" stroke="#166534" stroke-width="1"/>
    <path d="M -10 15 Q -5 -8 5 10" fill="#16A34A" stroke="#166534" stroke-width="1"/>
    <path d="M 5 15 Q 10 -5 20 12" fill="#16A34A" stroke="#166534" stroke-width="1"/>
    <path d="M 20 15 Q 25 -3 30 12" fill="#16A34A" stroke="#166534" stroke-width="1"/>
  </g>

  <!-- Text -->
  <text x="640" y="92" font-family="'Georgia', serif" font-size="34" font-weight="800" fill="#8B1D34">Bazaar</text>
  <text x="640" y="118" font-family="Arial, sans-serif" font-size="12" fill="#8B3A2A" opacity="0.9">Farm to family — no middlemen</text>
</svg>
