<?xml version="1.0" encoding="UTF-8"?>
<!-- Notable Voices banner — Bhikhari Thakur silhouette + tabla + book stack. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Notable Voices — Bihar's cultural icons">
  <defs>
    <linearGradient id="bgNt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="laurelNt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <rect width="900" height="180" fill="url(#bgNt)"/>

  <!-- Stars in the sky background -->
  <g fill="#FBBF24" opacity="0.7">
    <circle cx="70" cy="30" r="1.5"/>
    <circle cx="180" cy="20" r="2"/>
    <circle cx="280" cy="45" r="1.5"/>
    <circle cx="450" cy="15" r="2"/>
    <circle cx="560" cy="35" r="1.5"/>
    <circle cx="820" cy="25" r="2"/>
    <circle cx="880" cy="45" r="1.5"/>
    <circle cx="380" cy="30" r="1.5"/>
    <circle cx="720" cy="20" r="2"/>
  </g>

  <!-- Bhikhari Thakur silhouette — center, holding a book, in a folk-theater pose -->
  <g transform="translate(450 30)">
    <!-- Body -->
    <path d="M -25 130 Q -30 60 -20 40 Q -25 25 -18 20 L 18 20 Q 25 25 20 40 Q 30 60 25 130 Z" fill="#8B1D34"/>
    <!-- Turban (Bihari-style loosely tied) -->
    <ellipse cx="0" cy="-3" rx="20" ry="10" fill="#FBBF24"/>
    <path d="M -18 -8 Q 0 -18 18 -8 Q 25 5 15 12 L -15 12 Q -25 5 -18 -8 Z" fill="#F97316"/>
    <!-- Turban wrap detail -->
    <path d="M -10 5 Q 0 12 10 5" stroke="#B45309" stroke-width="1.5" fill="none" opacity="0.6"/>
    <!-- Head -->
    <circle cx="0" cy="15" r="14" fill="#D89460"/>
    <!-- Simple face -->
    <circle cx="-5" cy="14" r="1.5" fill="#2A1810"/>
    <circle cx="5" cy="14" r="1.5" fill="#2A1810"/>
    <path d="M -6 21 Q 0 24 6 21" stroke="#8B3A2A" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M -4 19 Q 0 17 4 19" stroke="#2A1810" stroke-width="1.5" fill="none"/>
    <!-- Dhoti hint -->
    <path d="M -25 130 L -30 165 L -8 165 L -3 130" fill="#FDF6EC"/>
    <path d="M 25 130 L 30 165 L 8 165 L 3 130" fill="#FDF6EC"/>
    <!-- Arm holding book -->
    <path d="M -25 55 L -45 75 L -40 82 L -22 65 Z" fill="#D89460"/>
    <!-- Book -->
    <rect x="-55" y="70" width="22" height="16" fill="#FBBF24" stroke="#B45309" stroke-width="1"/>
    <line x1="-44" y1="70" x2="-44" y2="86" stroke="#B45309" stroke-width="0.8"/>
  </g>

  <!-- Tabla pair (left, foreground) -->
  <g transform="translate(180 130)">
    <!-- Larger tabla (bayan - bass) -->
    <ellipse cx="-25" cy="15" rx="22" ry="8" fill="#78350F"/>
    <rect x="-45" y="0" width="40" height="15" fill="#B45309"/>
    <ellipse cx="-25" cy="0" rx="20" ry="8" fill="#FDF6EC"/>
    <ellipse cx="-25" cy="0" rx="20" ry="8" fill="none" stroke="#78350F" stroke-width="1.5"/>
    <!-- Syahi (black dot) -->
    <circle cx="-25" cy="0" r="6" fill="#2A1810"/>
    <!-- Straps -->
    <line x1="-45" y1="0" x2="-45" y2="15" stroke="#FDF6EC" stroke-width="1.2"/>
    <line x1="-5" y1="0" x2="-5" y2="15" stroke="#FDF6EC" stroke-width="1.2"/>

    <!-- Smaller tabla (dayan - treble) -->
    <ellipse cx="15" cy="15" rx="16" ry="6" fill="#78350F"/>
    <rect x="0" y="-5" width="30" height="20" fill="#B45309"/>
    <ellipse cx="15" cy="-5" rx="15" ry="6" fill="#FDF6EC"/>
    <ellipse cx="15" cy="-5" rx="15" ry="6" fill="none" stroke="#78350F" stroke-width="1.5"/>
    <circle cx="15" cy="-5" r="4.5" fill="#2A1810"/>
    <line x1="0" y1="-5" x2="0" y2="15" stroke="#FDF6EC" stroke-width="1.2"/>
    <line x1="30" y1="-5" x2="30" y2="15" stroke="#FDF6EC" stroke-width="1.2"/>
  </g>

  <!-- Book stack (right) -->
  <g transform="translate(720 145)">
    <rect x="-40" y="-15" width="80" height="8" fill="#DC2626"/>
    <rect x="-38" y="-13" width="76" height="1" fill="#FBBF24" opacity="0.7"/>
    <rect x="-42" y="-7" width="82" height="8" fill="#F97316"/>
    <rect x="-40" y="-5" width="78" height="1" fill="#FBBF24" opacity="0.7"/>
    <rect x="-38" y="1" width="76" height="8" fill="#B45309"/>
    <rect x="-36" y="3" width="72" height="1" fill="#FBBF24" opacity="0.7"/>
    <rect x="-40" y="9" width="80" height="8" fill="#16A34A"/>
    <rect x="-38" y="11" width="76" height="1" fill="#FBBF24" opacity="0.7"/>
    <!-- Book spine text hint (small vertical lines) -->
    <line x1="0" y1="-13" x2="0" y2="-9" stroke="#FBBF24" stroke-width="0.5" opacity="0.6"/>
    <line x1="10" y1="-5" x2="10" y2="-1" stroke="#FBBF24" stroke-width="0.5" opacity="0.6"/>
  </g>

  <!-- Laurel wreath icon overhead of Bhikhari (subtle) -->
  <g transform="translate(450 20)" opacity="0.8">
    <path d="M -30 0 Q -32 -5 -28 -10 Q -22 -12 -20 -8" stroke="url(#laurelNt)" stroke-width="1.5" fill="none"/>
    <path d="M 30 0 Q 32 -5 28 -10 Q 22 -12 20 -8" stroke="url(#laurelNt)" stroke-width="1.5" fill="none"/>
    <ellipse cx="-28" cy="-4" rx="3" ry="1.5" fill="#FBBF24"/>
    <ellipse cx="-23" cy="-8" rx="3" ry="1.5" fill="#FBBF24"/>
    <ellipse cx="28" cy="-4" rx="3" ry="1.5" fill="#FBBF24"/>
    <ellipse cx="23" cy="-8" rx="3" ry="1.5" fill="#FBBF24"/>
  </g>

  <!-- Text -->
  <text x="60" y="70" font-family="'Georgia', serif" font-size="34" font-weight="800" fill="#FDF6EC">Notable Voices</text>
  <text x="60" y="98" font-family="Arial, sans-serif" font-size="13" fill="#FBBF24" font-weight="600">Bihar's cultural icons — follow only</text>
  <text x="60" y="120" font-family="Arial, sans-serif" font-size="11" fill="#FDF6EC" opacity="0.85">Bhikhari Thakur · Dinkar · Renu · Sharda Sinha · Manoj Bajpayee · Pankaj Tripathi</text>
</svg>
