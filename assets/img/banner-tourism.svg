<?xml version="1.0" encoding="UTF-8"?>
<!-- Tourism banner — Bodh Gaya Mahabodhi temple + monk + Netarhat hills. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Tourism — Bihar and Jharkhand">
  <defs>
    <linearGradient id="skyTr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="0.5" stop-color="#F97316"/>
      <stop offset="1" stop-color="#FEF3EE"/>
    </linearGradient>
    <linearGradient id="stupaTr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B45309"/>
      <stop offset="1" stop-color="#78350F"/>
    </linearGradient>
  </defs>

  <rect width="900" height="180" fill="url(#skyTr)"/>

  <!-- Distant Netarhat hills (Jharkhand) -->
  <path d="M 0 130 L 100 90 L 180 115 L 260 85 L 330 110 L 400 130 L 400 180 L 0 180 Z" fill="#94A3B8" opacity="0.4"/>
  <path d="M 0 140 L 80 115 L 150 130 L 220 108 L 300 125 L 400 145 L 400 180 L 0 180 Z" fill="#64748B" opacity="0.35"/>

  <!-- Mahabodhi Temple (iconic Bodh Gaya pyramidal shikhar) — RIGHT SIDE -->
  <g transform="translate(680 30)">
    <!-- Main tower -->
    <path d="M -30 130
             L -25 30
             L 0 -5
             L 25 30
             L 30 130 Z" fill="url(#stupaTr)"/>
    <!-- Horizontal bands typical of Mahabodhi (5-7 bands) -->
    <line x1="-27" y1="45" x2="27" y2="45" stroke="#FDF6EC" stroke-width="1.2" opacity="0.5"/>
    <line x1="-27" y1="60" x2="27" y2="60" stroke="#FDF6EC" stroke-width="1.2" opacity="0.5"/>
    <line x1="-27" y1="75" x2="27" y2="75" stroke="#FDF6EC" stroke-width="1.2" opacity="0.5"/>
    <line x1="-27" y1="90" x2="27" y2="90" stroke="#FDF6EC" stroke-width="1.2" opacity="0.5"/>
    <line x1="-27" y1="105" x2="27" y2="105" stroke="#FDF6EC" stroke-width="1.2" opacity="0.5"/>
    <!-- Kalash (finial) on top -->
    <ellipse cx="0" cy="-8" rx="4" ry="6" fill="#FBBF24"/>
    <rect x="-1" y="-16" width="2" height="10" fill="#FBBF24"/>
    <!-- Small side stupas -->
    <path d="M -50 130 L -47 85 L -40 75 L -33 85 L -30 130 Z" fill="url(#stupaTr)" opacity="0.9"/>
    <path d="M 30 130 L 33 85 L 40 75 L 47 85 L 50 130 Z" fill="url(#stupaTr)" opacity="0.9"/>
    <ellipse cx="-40" cy="72" rx="3" ry="4" fill="#FBBF24"/>
    <ellipse cx="40" cy="72" rx="3" ry="4" fill="#FBBF24"/>
    <!-- Temple base platform -->
    <rect x="-60" y="130" width="120" height="15" fill="#78350F"/>
    <rect x="-65" y="140" width="130" height="8" fill="#5A2A0A"/>
  </g>

  <!-- Bodhi Tree beside Mahabodhi (LEFT of temple) -->
  <g transform="translate(590 100)">
    <!-- Trunk -->
    <rect x="-4" y="30" width="8" height="45" fill="#5A2A0A"/>
    <!-- Foliage (peepal tree characteristic — bushy) -->
    <circle cx="-22" cy="18" r="24" fill="#166534"/>
    <circle cx="22" cy="18" r="24" fill="#166534"/>
    <circle cx="0" cy="5" r="30" fill="#16A34A"/>
    <circle cx="-15" cy="30" r="18" fill="#15803D"/>
    <circle cx="15" cy="30" r="18" fill="#15803D"/>
    <!-- Highlights -->
    <circle cx="-5" cy="-2" r="5" fill="#4ADE80" opacity="0.7"/>
    <circle cx="15" cy="15" r="4" fill="#4ADE80" opacity="0.7"/>
  </g>

  <!-- Monk silhouette (foreground, seated on ground - left of temple) -->
  <g transform="translate(490 130)">
    <!-- Body/robe (saffron) -->
    <path d="M -20 40 Q -25 5 0 -5 Q 25 5 20 40 Z" fill="#EA580C"/>
    <!-- Head (bald) -->
    <circle cx="0" cy="-10" r="10" fill="#D89460"/>
    <!-- Shoulder cloth -->
    <path d="M -22 5 Q 0 -8 22 5 Q 20 15 -20 15 Z" fill="#F97316"/>
    <!-- Hands folded in prayer (small triangle) -->
    <path d="M -5 12 L 5 12 L 0 25 Z" fill="#D89460"/>
    <!-- Ground shadow -->
    <ellipse cx="0" cy="42" rx="25" ry="4" fill="#5A2A0A" opacity="0.4"/>
  </g>

  <!-- Text -->
  <text x="60" y="70" font-family="'Georgia', serif" font-size="40" font-weight="800" fill="#8B1D34">Tourism</text>
  <text x="60" y="98" font-family="Arial, sans-serif" font-size="15" fill="#8B3A2A" font-weight="600">Bihar · Jharkhand</text>
  <text x="60" y="122" font-family="Arial, sans-serif" font-size="12" fill="#B45309" opacity="0.85">Bodh Gaya · Nalanda · Betla · Netarhat · Deoghar</text>
  <text x="60" y="140" font-family="Arial, sans-serif" font-size="11" fill="#78350F" opacity="0.8">30 curated destinations across both states</text>
</svg>
